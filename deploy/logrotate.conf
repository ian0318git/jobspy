# jobspy 日誌輪替設定。
# 由 jobboard-logrotate.timer → jobboard-logrotate.service 驅動。
#
# 為什麼不用 cron（alpha-validator 用的是 cron，這裡刻意不同）：
# 這台 VM 跟著宿主機 suspend，**cron 錯過就是永遠錯過**，沒有補做機制。
# systemd timer 的 Persistent=true 會在喚醒後補做 —— 與 jobscan.timer 同一套理由。
# 若有人為了「跟 alpha 對齊」把這裡改回 crontab，等於默默放棄跨休眠的輪替。
#
# copytruncate 是必要的、不是可選的：
#   job_board.log ← jobboard.service 的 StandardOutput=append:
#   cron_search.log ← jobscan.service 的 StandardOutput=append:
# systemd 持有這兩個 fd 且不會重開檔。若用預設的 rename 方式輪替，
# 寫入會繼續落在已被改名的舊 inode 上（幽靈檔），而新的 job_board.log 永遠是空的。
# 已確認 systemd 的 append: 以 O_APPEND 開檔，截斷後寫入落在新檔尾端，不產生 NUL 空洞。
#
# 已知且接受的取捨：copytruncate 在「複製完、截斷前」有一個極短窗口，
# 該窗口內寫入的行會遺失。對這兩份日誌而言可接受（不是帳務資料）。
# 若 logrotate 補跑時正好撞上 06:00/22:00 的掃描，cron_search.log 可能少掉幾行逐字稿。
#
# 刻意列出明確路徑而不是 logs/*.log：
#   logs/search_current.log 由 run_scan.sh 每輪 : > 截斷，本來就是有界的，
#   且它是看板即時跟讀的來源，被輪替只會讓 follower 白做一次 truncation reset。

/home/ian/github-project/jobspy/job_board.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
    dateformat -%Y-%m-%d
}

/home/ian/github-project/jobspy/logs/cron_search.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
    dateformat -%Y-%m-%d
}
